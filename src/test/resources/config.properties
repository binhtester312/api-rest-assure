# GoRest API - Automation Framework Config
# ==========================================
# QUAN TRỌNG: File này KHÔNG chứa token/credentials
# Token phải được set qua environment variable: GOREST_TOKEN
# hoặc Maven property: -Dgorest.token=xxx

# Base URL của API
base.url=https://gorest.co.in/public/v2

# Timeout (milliseconds)
connection.timeout=10000
socket.timeout=10000

# Log level: ALL | NONE | HEADERS | BODY | STATUS
log.level=ALL
